apply plugin: 'com.android.application'

android {
    namespace = "za.co.emmaus.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId = "za.co.emmaus.app"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 2
        versionName = "1.1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
             ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("EMMAUS_ANDROID_KEYSTORE_PATH")
            def keystorePassword = System.getenv("EMMAUS_ANDROID_KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("EMMAUS_ANDROID_KEY_ALIAS")
            def keyPassword = System.getenv("EMMAUS_ANDROID_KEY_PASSWORD")
            if (keystorePath && keystorePassword && keyAlias && keyPassword) {
                storeFile = rootProject.file(keystorePath)
                storePassword = keystorePassword
                this.keyAlias = keyAlias
                this.keyPassword = keyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix = ".widgettest3"
            versionNameSuffix = "-widget-test-3"
            resValue "string", "app_name", "Emmaus Widget Preview"
            resValue "string", "title_activity_main", "Emmaus Widget Preview"
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.release
            proguardFiles = [getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro']
        }
    }
}

def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
    doLast {
        def required = [
            "EMMAUS_ANDROID_KEYSTORE_PATH",
            "EMMAUS_ANDROID_KEYSTORE_PASSWORD",
            "EMMAUS_ANDROID_KEY_ALIAS",
            "EMMAUS_ANDROID_KEY_PASSWORD",
        ]
        def missing = required.findAll { !System.getenv(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Release signing is required. Configure the missing Android signing environment values: ${missing.join(', ')}")
        }
        def keystore = rootProject.file(System.getenv("EMMAUS_ANDROID_KEYSTORE_PATH"))
        if (!keystore.isFile()) {
            throw new GradleException("Release signing keystore was not found at the configured path.")
        }
    }
}

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn(verifyReleaseSigning)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
