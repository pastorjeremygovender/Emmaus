<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White app-icon background -->
  <rect width="180" height="180" rx="36" fill="#FFFFFF"/>
  <!-- Dark green fill (matches logo colour) -->
  <rect x="8" y="8" width="164" height="164" rx="28" fill="#0A5738"/>
  <!-- E — left vertical stroke (also the road border) -->
  <rect x="30" y="30" width="20" height="120" rx="5" fill="#FFFFFF"/>
  <!-- E — top horizontal bar -->
  <rect x="30" y="30" width="100" height="24" rx="5" fill="#FFFFFF"/>
  <!-- E — middle horizontal bar (slightly shorter) -->
  <rect x="30" y="80" width="80" height="20" rx="5" fill="#FFFFFF"/>
  <!-- E — bottom horizontal bar -->
  <rect x="30" y="126" width="100" height="24" rx="5" fill="#FFFFFF"/>
  <!-- Cross — vertical beam (above the E, at top of road) -->
  <rect x="36" y="8"  width="10" height="32" rx="4" fill="#FFFFFF"/>
  <!-- Cross — horizontal beam -->
  <rect x="26" y="18" width="30" height="10" rx="4" fill="#FFFFFF"/>
</svg>
