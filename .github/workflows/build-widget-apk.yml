name: Build Emmaus widget APK

on:
  push:
    branches:
      - codex/android-daily-rhythm-widget
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out widget branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Make Gradle wrapper executable
        run: chmod +x artifacts/project-emmaus/android/gradlew

      - name: Build debug APK
        run: pnpm --filter @workspace/project-emmaus run android:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: emmaus-daily-rhythm-widget-debug
          path: artifacts/project-emmaus/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
