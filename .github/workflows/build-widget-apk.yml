name: Build unified Emmaus Android app

on:
  push:
    branches:
      - release/emmaus-unified
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  EMMAUS_ANDROID_BUILD: unified-release-candidate
  EMMAUS_ANDROID_TEST_BUILD_TYPE: debug

jobs:
  build-debug-apk:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Check out unified source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Enable pnpm
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Make Gradle wrapper executable
        run: chmod +x artifacts/project-emmaus/android/gradlew
      - name: Verify Android release configuration
        run: pnpm --filter @workspace/project-emmaus run android:verify
      - name: Build unified debug APK
        run: pnpm --filter @workspace/project-emmaus run android:assembleDebug
      - name: Run real permission lifecycle tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 4
          disk-size: 2048M
          disable-animations: true
          script: cd artifacts/project-emmaus/android && ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc8-debug-permission-test-report
          path: |
            artifacts/project-emmaus/android/app/build/reports/androidTests/connected/**
            artifacts/project-emmaus/android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unified installable APK
        uses: actions/upload-artifact@v4
        with:
          name: emmaus-unified-testing-apk
          path: artifacts/project-emmaus/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
