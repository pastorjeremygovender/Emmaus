name: Verify concise Jarvis responses

on:
  push:
    branches:
      - codex/jarvis-completion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-jarvis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run Jarvis response tests
        run: pnpm --filter @workspace/api-server exec node --test --import=tsx/esm src/emmaus/__tests__/system-instructions.test.ts src/emmaus/__tests__/response-normalization.test.ts
      - name: Typecheck API server
        run: pnpm run typecheck:libs && pnpm --filter @workspace/api-server run typecheck
